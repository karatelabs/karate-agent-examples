# traceability-demo on GitHub Actions — the PURE-GIT / spec-driven posture.
#
# Runs the karate-agent container one-shot over the full suite (rules oracle + REST API + browser UI via
# `launch`). No ADO coordinates are set, so the
# RTM treats the requirements markdown as the source of truth (ids render as plain text, no tracker) — the
# spec-driven-development story. The SAME kit runs ALM-linked on Azure Pipelines (traceability-demo/azure-pipelines.yml).
#
# One-time setup: add a repository secret KARATE_LICENSE (the inline karate.lic text). Without it the engine's
# license check fails the run.
name: traceability-demo (pure-git RTM)

on:
  push:
    paths: [ 'traceability-demo/**', '.github/workflows/traceability-demo.yml' ]
  pull_request:
    paths: [ 'traceability-demo/**' ]
  workflow_dispatch:


permissions:
  contents: write        # peaceiris publishes the HTML report to the gh-pages branch
  checks: write          # dorny/test-reporter writes the JUnit check
  pull-requests: write
  packages: read         # pull the engine image from GHCR (this block is explicit, so unlisted = none)

jobs:
  # the shared publish-race gate (engine-gate.yml) — a missing engine image SKIPS the kit, never fails it
  engine:
    uses: ./.github/workflows/engine-gate.yml

  karate:
    needs: engine
    if: needs.engine.outputs.present == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traceability-demo
    # On a pull request the reviewed commit is the HEAD of the branch, not the merge commit Actions
    # synthesizes. The confidence-gate check can only be posted against a commit the PR shows, and the
    # requirement deep-links must point at the same one — so the whole job runs on that sha.
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The engine image is pulled from GHCR, AUTHENTICATED with the run's own GITHUB_TOKEN: the package is
      # private and this repo is granted read on it, and an authenticated pull is not subject to the
      # anonymous per-IP rate limit that throttles a shared runner. The public ECR image
      # (public.ecr.aws/karatelabs/karate-agent) stays the customer-facing, credential-free way to pull the
      # engine — and is what the Azure pipeline uses, since it has no GITHUB_TOKEN.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Karate full suite (rules + REST + UI, pure-git RTM)
        # `karate:jsonl` is required: coverage + the RTM are computed from that event stream.
        run: |
          IMAGE=ghcr.io/karatelabs/karate-agent:2.1.4.RC1
          # Authenticated (see the login step) — no anonymous rate limit, so no retry loop. Each engine
          # release mirrors this tag to GHCR via the "Publish image -> GHCR (manual)" workflow.
          docker pull "$IMAGE"
          # the karate-agent image runs as a NON-root user; pre-make target/ world-writable so the container
          # can write the report / JUnit / coverage into the runner-owned checkout.
          mkdir -p target && chmod -R 777 target
          # Pass the git coordinates for the pure-git RTM link: the requirement ids click through to
          # their heading in the markdown at THIS repo + commit. github.repository auto-follows a fork; HEAD_SHA
          # pins each link to the reviewed commit; the kit lives in the traceability-demo/ subdir of the monorepo.
          #
          # `launch suite.karate.js` serves the SUT + runs the WHOLE suite (rules oracle + REST API + browser UI)
          # as ONE consolidated report — HTML + JUnit (Checks tab) + JSONL (coverage/RTM) + screenshots — in
          # target/karate-reports. The browser stage runs non-headless under the image's Xvfb; add
          # -e KARATE_VIDEO=true to also record video.mp4.
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e KARATE_LICENSE_TEXT="$KARATE_LICENSE_TEXT" \
            -e KARATE_GIT_REPO_URL="https://github.com/${{ github.repository }}" \
            -e KARATE_GIT_REF="$HEAD_SHA" \
            -e KARATE_GIT_BASE="traceability-demo" \
            "$IMAGE" \
            launch suite.karate.js
        env:
          KARATE_LICENSE_TEXT: ${{ secrets.KARATE_LICENSE }}

      # The gate renders verdicts the suite already computed (readiness + the OpenAPI lint) into ONE check
      # payload — so it runs even when the suite went red, which is exactly when the verdict is worth having.
      # KARATE_GIT_BASE doubles as the annotation path prefix: the container works in the kit dir, GitHub
      # annotates repository paths.
      - name: Confidence gate payload
        if: always()
        run: |
          IMAGE=ghcr.io/karatelabs/karate-agent:2.1.4.RC1
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e KARATE_LICENSE_TEXT="$KARATE_LICENSE_TEXT" \
            -e KARATE_GIT_REPO_URL="https://github.com/${{ github.repository }}" \
            -e KARATE_GIT_REF="$HEAD_SHA" \
            -e KARATE_GIT_BASE="traceability-demo" \
            "$IMAGE" \
            launch gate.karate.js
        env:
          KARATE_LICENSE_TEXT: ${{ secrets.KARATE_LICENSE }}

      # The container wrote these files as its non-root user; take the tree back so the steps below can read it.
      - name: Reclaim ownership of the container-written tree
        if: always()
        run: |
          for d in target runs contract .karate; do
            [ -e "$d" ] && sudo chown -R "$(id -u):$(id -g)" "$d"
          done
          true

      - name: Post the confidence gate check
        if: always()
        uses: ./.github/actions/confidence-gate
        with:
          payload: traceability-demo/target/karate-gate.json
          head-sha: ${{ env.HEAD_SHA }}

      - name: Publish test results (Checks tab)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: karate tests
          path: 'traceability-demo/target/karate-reports/**/junit-xml/*.xml'
          reporter: java-junit

      - name: Upload report + RTM + evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-report
          path: traceability-demo/target/karate-reports

      # Publish the HTML report (RTM · coverage · summary) to GitHub Pages, per-kit subdir so kits don't
      # clobber each other. Browsable at https://<owner>.github.io/karate-agent-examples/traceability-demo/.
      # One-time: enable Pages (Settings → Pages → Deploy from a branch → gh-pages).
      # Every kit publishes into its own destination_dir on ONE shared gh-pages branch, so two
      # workflows finishing together race on the push and the loser dies with `! [rejected]
      # (fetch first)` — a red run whose tests all passed. A push touching several kits does that
      # every time. Retry rather than serialize: a concurrency group queues only one run, so a
      # third kit cancels the second outright. The retry re-clones gh-pages, so it rebases.
      - name: Publish HTML report to GitHub Pages
        id: pages
        continue-on-error: true
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: traceability-demo/target/karate-reports
          destination_dir: traceability-demo
          keep_files: true

      - name: Retry the publish (another kit won the race for gh-pages)
        if: always() && github.ref == 'refs/heads/main' && steps.pages.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: traceability-demo/target/karate-reports
          destination_dir: traceability-demo
          keep_files: true
