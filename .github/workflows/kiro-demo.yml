# kiro-demo on GitHub Actions — the task gate.
#
# The requirement source is the kit's own spec folder (.kiro/specs/), and its tasks.md ships with the work
# ticked complete. The run proves the point in about half a second: every scenario passes, and the readiness
# verdict is still NOT READY, because one criterion a completed task claims has no check behind it.
#
# No browser and no SUT process — the service is served in-process — so this is the cheapest kit to run and
# the fastest signal in the repo.
#
# One-time setup: add a repository secret KARATE_LICENSE (the inline karate.lic text). Without it the
# engine's license check fails the run.
name: kiro-demo (the task gate)

on:
  push:
    paths: [ 'kiro-demo/**', '.github/workflows/kiro-demo.yml' ]
  pull_request:
    paths: [ 'kiro-demo/**' ]
  workflow_dispatch:


permissions:
  contents: write        # peaceiris publishes the HTML report to the gh-pages branch
  checks: write          # dorny/test-reporter writes the JUnit check
  pull-requests: write
  packages: read         # pull the engine image from GHCR (this block is explicit, so unlisted = none)

jobs:
  karate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiro-demo
    steps:
      - uses: actions/checkout@v4

      # Authenticated GHCR pull: the package is private, this repo is granted read on it, and an
      # authenticated pull avoids the anonymous per-IP rate limit on shared runners. The public ECR image
      # (public.ecr.aws/karatelabs/karate-agent) stays the customer-facing, credential-free way to pull.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Karate suite (rules oracle + REST) and the task gate
        run: |
          IMAGE=ghcr.io/karatelabs/karate-agent:2.1.3.RC1
          docker pull "$IMAGE"
          # the karate-agent image runs as a NON-root user; pre-make target/ world-writable so the container
          # can write the report / JUnit / coverage into the runner-owned checkout.
          mkdir -p target && chmod -R 777 target
          # The git coordinates make every requirement id in the RTM click through to its heading in the
          # spec at THIS repo + commit: github.repository auto-follows a fork, github.sha pins the link to
          # the reviewed commit, and the kit lives in the kiro-demo/ subdir.
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e KARATE_LICENSE_TEXT="$KARATE_LICENSE_TEXT" \
            -e KARATE_GIT_REPO_URL="https://github.com/${{ github.repository }}" \
            -e KARATE_GIT_REF="${{ github.sha }}" \
            -e KARATE_GIT_BASE="kiro-demo" \
            "$IMAGE" \
            launch suite.karate.js
        env:
          KARATE_LICENSE_TEXT: ${{ secrets.KARATE_LICENSE }}

      - name: Publish test results (Checks tab)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: kiro-demo tests
          path: 'kiro-demo/target/karate-reports/**/junit-xml/*.xml'
          reporter: java-junit

      - name: Upload report + RTM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiro-demo-report
          path: kiro-demo/target/karate-reports

      # Publish the HTML report to GitHub Pages, per-kit subdir so kits don't clobber each other. The
      # traceability page is the one to link: a green suite whose verdict is NOT READY.
      # Every kit publishes into its own destination_dir on ONE shared gh-pages branch, so two
      # workflows finishing together race on the push and the loser dies with `! [rejected]
      # (fetch first)` — a red run whose tests all passed. A push touching several kits does that
      # every time. Retry rather than serialize: a concurrency group queues only one run, so a
      # third kit cancels the second outright. The retry re-clones gh-pages, so it rebases.
      - name: Publish HTML report to GitHub Pages
        id: pages
        continue-on-error: true
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: kiro-demo/target/karate-reports
          destination_dir: kiro-demo
          keep_files: true

      - name: Retry the publish (another kit won the race for gh-pages)
        if: always() && github.ref == 'refs/heads/main' && steps.pages.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: kiro-demo/target/karate-reports
          destination_dir: kiro-demo
          keep_files: true
