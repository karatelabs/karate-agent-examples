# policy-api on GitHub Actions — the PURE-GIT / spec-driven posture, REST + rules + the paired run.
#
# Runs the karate-agent container one-shot over the REST suite (the covering-array coverage demo + the
# OpenAPI operations) plus the run-free rules RTM. KARATE_GRPC_OFF is set, so karate-boot.js skips the grpc
# beat the container image can't serve — the full REST + gRPC + Kafka cross-protocol story runs live off the
# async jar (see the README), not here. No ADO coordinates are set: the requirement ids deep-link to their
# heading in the markdown source of truth on THIS repo + commit (requirements.provider, git), so anyone can
# browse the published RTM and click RATE-001 through to requirements/rating.md — no license needed to READ.
#
# It then starts the REST face of the kit's own Java backend and MINTS A PAIR against it — one suite, two
# targets, a measured divergence set — so the published report carries a live contract-test page beside the
# Coverage and Traceability ones. That step is also the parity gate between the kit's TWO implementations
# of the same contract (the karate mock and rating-server), which nothing else in CI builds.
#
# One-time setup: add a repository secret KARATE_LICENSE (the inline karate.lic text). Without it the engine's
# license check fails the run. Enable Pages (Settings -> Pages -> Deploy from a branch -> gh-pages).
name: policy-api (pure-git RTM, REST + rules + the paired run)

on:
  push:
    paths: [ 'policy-api/**', '.github/workflows/policy-api.yml' ]
  pull_request:
    paths: [ 'policy-api/**' ]
  workflow_dispatch:


permissions:
  contents: write        # peaceiris publishes the HTML report to the gh-pages branch
  checks: write          # dorny/test-reporter writes the JUnit check
  pull-requests: write
  packages: read         # pull the engine image from GHCR (this block is explicit, so unlisted = none)

jobs:
  karate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: policy-api
    steps:
      - uses: actions/checkout@v4

      # The engine image is pulled from GHCR, AUTHENTICATED with the run's own GITHUB_TOKEN: the package is
      # private and this repo is granted read on it, and an authenticated pull is not subject to the
      # anonymous per-IP rate limit that throttles a shared runner. The public ECR image
      # (public.ecr.aws/karatelabs/karate-agent) stays the customer-facing, credential-free way to pull the
      # engine — and is what the Azure pipeline uses, since it has no GITHUB_TOKEN.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Karate REST suite + rules RTM (pure-git RTM)
        # `karate:jsonl` is required: coverage + the RTM are computed from that event stream.
        run: |
          IMAGE=ghcr.io/karatelabs/karate-agent:2.1.3.RC1
          # Authenticated (see the login step) — no anonymous rate limit, so no retry loop. Each engine
          # release mirrors this tag to GHCR via the "Publish image -> GHCR (manual)" workflow.
          docker pull "$IMAGE"
          # the karate-agent image runs as a NON-root user; pre-make target/ world-writable so the container
          # can write the report / JUnit / coverage into the runner-owned checkout.
          mkdir -p target && chmod -R 777 target
          # KARATE_GRPC_OFF: the container image has no grpc ext — run REST + rules only (karate-boot.js gate).
          # KARATE_GIT_*: the pure-git RTM deep-link — requirement ids click through to their heading in the
          # markdown at THIS repo + commit. github.repository auto-follows a fork; github.sha pins each link
          # to the reviewed commit; the kit lives in the policy-api/ subdir of the examples repo.
          #
          # `launch suite.karate.js` runs the WHOLE REST + rules suite as ONE consolidated report — HTML +
          # JUnit (Checks tab) + JSONL (coverage/RTM) — in target/karate-reports. No browser stage (REST only).
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e KARATE_LICENSE_TEXT="$KARATE_LICENSE_TEXT" \
            -e KARATE_GRPC_OFF=1 \
            -e KARATE_GIT_REPO_URL="https://github.com/${{ github.repository }}" \
            -e KARATE_GIT_REF="${{ github.sha }}" \
            -e KARATE_GIT_BASE="policy-api" \
            "$IMAGE" \
            launch suite.karate.js
        env:
          KARATE_LICENSE_TEXT: ${{ secrets.KARATE_LICENSE }}

      # ── the PAIRED RUN — one suite, two targets, and the only parity gate these two implementations have ──
      # policy-api implements its own contract TWICE: mock/policy-mock.feature (the mock it hands to
      # consuming teams) and rating-server's REST face in Java. Nothing else in CI builds the kit's maven
      # module, so without this step the two drift silently — and they HAVE disagreed (a coercion case, a
      # blank string, an empty body), each found by a pair and hand-aligned afterwards. The evidence that
      # they still agree is the pair itself, so minting one here IS the gate.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the provider (rating-server's REST face)
        run: mvn -q -f rating-server/pom.xml package

      - name: Start the provider — clean, on :8080
        # It is an in-memory backend, so a provider carrying an earlier run's rows would make the list
        # endpoint answer differently on the two legs. A fresh runner gives us that for free; the readiness
        # probe is what stops the pair from minting `notMeasured` rows against a server still booting.
        run: |
          nohup java -cp rating-server/target/rating-server.jar \
            io.karatelabs.examples.insurance.PolicyServer 8080 > policy-server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/policies >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8080/policies >/dev/null \
            || { echo "the provider did not come up:"; cat policy-server.log; exit 1; }

      - name: Contract pair (the shipped mock vs the provider)
        # The provider runs on the RUNNER and the pair's own mock leg stands up inside the container, so the
        # container needs a route back to the host: `--add-host …:host-gateway` is that route, and it is the
        # same spelling a developer uses on a laptop, so this step is reproducible off CI. PROVIDER_URL and
        # PROVIDER_ENV are read by contract.karate.js off the process (Settings.sysenv), so CI hands it a
        # target without editing the kit, and the environment label rides INTO the evidence.
        # The evidence file lands in contract/pairs/, which the container's NON-root user has to be able to
        # write — so the dir is pre-made world-writable here. `target/` is NOT re-chmodded: the step above
        # already made it writable, and everything under it now belongs to the container user, so a
        # recursive chmod by the runner user fails ("Operation not permitted") and kills the step before
        # docker is even reached. Make writable only what this step introduces.
        # A provider that never came up mints a pair that measured NOTHING, and the script fails the job on
        # it rather than letting an empty divergence set read as a clean bill of health.
        # KARATE_GIT_* is passed HERE TOO, and not by accident: this step re-renders the Traceability page
        # so its nav can reach the new Contract one, and a render without these falls back to `main` — so
        # every green run would quietly replace requirement links pinned to the reviewed commit with links
        # to a moving branch (on a fork, to the wrong repo). The deep-link IS the kit's headline feature.
        run: |
          IMAGE=ghcr.io/karatelabs/karate-agent:2.1.3.RC1
          mkdir -p contract/pairs && chmod 777 contract contract/pairs
          docker run --rm --add-host=host.docker.internal:host-gateway \
            -v "$PWD":/work -w /work \
            -e KARATE_LICENSE_TEXT="$KARATE_LICENSE_TEXT" \
            -e KARATE_GRPC_OFF=1 \
            -e PROVIDER_URL=http://host.docker.internal:8080 \
            -e PROVIDER_ENV=ci \
            -e KARATE_GIT_REPO_URL="https://github.com/${{ github.repository }}" \
            -e KARATE_GIT_REF="${{ github.sha }}" \
            -e KARATE_GIT_BASE="policy-api" \
            "$IMAGE" \
            launch contract.karate.js
        env:
          KARATE_LICENSE_TEXT: ${{ secrets.KARATE_LICENSE }}

      - name: Upload the pair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-pair
          path: policy-api/contract/pairs

      - name: Publish test results (Checks tab)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: karate tests
          path: 'policy-api/target/karate-reports/**/junit-xml/*.xml'
          reporter: java-junit

      - name: Upload report + RTM + evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-report
          path: policy-api/target/karate-reports

      # Publish the HTML report (RTM · coverage · summary) to GitHub Pages, per-kit subdir so kits don't
      # clobber each other. Browsable at https://<owner>.github.io/karate-agent-examples/policy-api/.
      # One-time: enable Pages (Settings → Pages → Deploy from a branch → gh-pages).
      # Every kit publishes into its own destination_dir on ONE shared gh-pages branch, so two
      # workflows finishing together race on the push and the loser dies with `! [rejected]
      # (fetch first)` — a red run whose tests all passed. A push touching several kits does that
      # every time. Retry rather than serialize: a concurrency group queues only one run, so a
      # third kit cancels the second outright. The retry re-clones gh-pages, so it rebases.
      - name: Publish HTML report to GitHub Pages
        id: pages
        continue-on-error: true
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: policy-api/target/karate-reports
          destination_dir: policy-api
          keep_files: true

      - name: Retry the publish (another kit won the race for gh-pages)
        if: always() && github.ref == 'refs/heads/main' && steps.pages.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: policy-api/target/karate-reports
          destination_dir: policy-api
          keep_files: true
