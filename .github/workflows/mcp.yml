# The MCP kit, run through the karate-agent CONTAINER IMAGE — the same kit protocols.yml runs off the
# engine jar. MCP is the one protocol kit that has an image lane at all: it needs no protocol libraries,
# so the standard agent image already carries the client, and the image is published ahead of the jar
# release — this is how the kit goes live first.
#
# This workflow publishes NOTHING to gh-pages: protocols.yml owns the /mcp/ report, so the two lanes
# never race on the same destination.
#
# One-time setup: the KARATE_LICENSE repository secret (the inline karate.lic text).
name: mcp (container image)

on:
  push:
    paths: [ 'mcp/**', '.github/workflows/mcp.yml' ]
  pull_request:
    paths: [ 'mcp/**' ]
  workflow_dispatch:

permissions:
  checks: write          # dorny/test-reporter writes the JUnit check
  packages: read         # pull the engine image from GHCR

jobs:
  # the shared publish-race gate (engine-gate.yml) — a missing engine image SKIPS the kit, never fails it
  engine:
    uses: ./.github/workflows/engine-gate.yml

  karate:
    needs: engine
    if: needs.engine.outputs.present == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/server/package-lock.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: MCP kit through the image
        run: |
          npm --prefix server ci
          npm --prefix server start &
          for _ in $(seq 1 30); do (echo > /dev/tcp/localhost/3001) 2>/dev/null && break; sleep 1; done
          IMAGE=ghcr.io/karatelabs/karate-agent:2.1.3.RC3
          docker pull "$IMAGE"
          # the image runs as a NON-root user; pre-make target/ world-writable so it can write the report
          mkdir -p target && chmod -R 777 target
          # the server runs on the runner, so the container reaches it through the host gateway and
          # MCP_URL overrides the endpoint karate-boot.js defaults to
          docker run --rm \
            -v "$PWD":/work -w /work \
            --add-host=host.docker.internal:host-gateway \
            -e KARATE_LICENSE_TEXT="$KARATE_LICENSE_TEXT" \
            -e MCP_URL="http://host.docker.internal:3001/mcp" \
            "$IMAGE" \
            run -f html,junit:xml checks
        env:
          KARATE_LICENSE_TEXT: ${{ secrets.KARATE_LICENSE }}

      # The official conformance suite is the COMPANION, not a gate: most of its scenarios drive fixture
      # tools/resources/prompts a six-tool inventory server does not implement, so it legitimately exits
      # non-zero. continue-on-error keeps that from turning the run red.
      - name: MCP conformance suite (companion)
        continue-on-error: true
        run: npx @modelcontextprotocol/conformance@0.1.16 server --url http://localhost:3001/mcp

      - name: Publish test results (Checks tab)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: karate mcp tests (image)
          path: 'mcp/target/karate-reports/**/junit-xml/*.xml'
          reporter: java-junit
          fail-on-empty: false

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-image-report
          retention-days: 7
          path: mcp/target/karate-reports
          if-no-files-found: ignore
