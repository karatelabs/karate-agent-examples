syntax = "proto3";

option java_package = "demo";
option java_multiple_files = true;

// The demo service. One proto is the single source of truth here: the server generates its stubs from
// this file, and the Karate feature reads the SAME file at run time to build dynamic descriptors — so
// there are no generated classes on the test side and nothing to regenerate when the contract changes.
service HelloService {
  rpc Hello (HelloRequest) returns (HelloReply) {}
  rpc LotsOfReplies (HelloRequest) returns (stream HelloReply) {}
  rpc LotsOfGreetings (stream HelloRequest) returns (HelloReply) {}
  rpc BidiHello (stream HelloRequest) returns (stream HelloReply) {}
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
